name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  blkc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: blkc
      - run: npm run lint:all
        working-directory: blkc
      - run: npm run typecheck
        working-directory: blkc
      - run: npm run build:all
        working-directory: blkc
      - run: npm run test:all
        working-directory: blkc
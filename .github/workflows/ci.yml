name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: matrix.runtime == 'node'
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            # --ignore-scripts: skip the root 'prepare' script, which runs build:all
            # during install before workspace deps are linked. The Build step handles it.
            bun install --ignore-scripts
          else
            npm ci
          fi

      - name: Lint
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun run lint:all
          else
            npm run lint:all
          fi

      - name: Build
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun run build:all
          else
            npm run build:all
          fi

      - name: Typecheck
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun run typecheck
          else
            npm run typecheck
          fi

      - name: Test
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun run test:all
          else
            npm run test:all
          fi

  licence:
    name: Licence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check licences
        # The root package is private (UNLICENSED by design) and must be excluded.
        run: npx --yes license-checker-rseidelsohn --excludePrivatePackages --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;BlueOak-1.0.0;CC0-1.0;Python-2.0;LGPL-2.1-or-later;LGPL-3.0-or-later;CC-BY-4.0"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action requires a licence key for organisation accounts,
      # so run the (free, open-source) CLI directly instead. Same tool, same rules.
      - name: Install gitleaks
        run: |
          VERSION=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Secret scan
        run: gitleaks detect --source . --verbose --redact --exit-code 1